name: Temporary Whisper model fetch

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper model
        run: |
          curl -L --fail --retry 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin" \
            -o ggml-small-q5_1.bin
          sha256sum ggml-small-q5_1.bin
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1.bin
          path: ggml-small-q5_1.bin
          retention-days: 1
